name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install EAS CLI directly
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm install

      - name: Patch FFmpeg Kit
        run: |
          echo "Patching FFmpeg Kit build.gradle..."
          sed -i 's/com\.arthenica/dev.ffmpegkit-maintained/g' node_modules/ffmpeg-kit-react-native/android/build.gradle
          sed -i 's/6\.0-2/6.0.3/g' node_modules/ffmpeg-kit-react-native/android/build.gradle
          echo "Patch applied successfully."

      - name: Link Expo Project
        run: npx eas init --account calnrxs-team --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build with EAS
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
