name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Patch FFmpeg Kit
        run: |
          echo "Patching FFmpeg Kit..."
          sed -i 's/implementation.*com\.arthenica.*/implementation '\''dev.ffmpegkit-maintained:ffmpeg-kit-https:6.0.3'\''/' node_modules/ffmpeg-kit-react-native/android/build.gradle
          echo "Patch applied!"
          cat node_modules/ffmpeg-kit-react-native/android/build.gradle | grep "implementation.*ffmpeg"

      - name: Generate Android files
        run: npx expo prebuild --platform android --clean

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
