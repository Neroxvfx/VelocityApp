name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Patch FFmpeg Kit
        run: |
          echo "Patching FFmpeg Kit..."
          sed -i 's/implementation.*com\.arthenica.*/implementation '\''dev.ffmpegkit-maintained:ffmpeg-kit-https:6.0.3'\''/' node_modules/ffmpeg-kit-react-native/android/build.gradle
          echo "Patch applied!"

      - name: Generate Android files
        run: npx expo prebuild --platform android --clean

      - name: Add splash color
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/splash_color.xml <<'EOF'
          <resources>
            <color name="splashscreen_background">#FFFFFF</color>
          </resources>
          EOF

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          export GRADLE_OPTS="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1"
          ./gradlew assembleRelease --no-daemon --max-workers=1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
