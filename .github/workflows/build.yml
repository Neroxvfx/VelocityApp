name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Patch FFmpeg Kit wrapper
        run: |
          F=node_modules/ffmpeg-kit-react-native/android/build.gradle
          sed -i '/implementation.*com\.arthenica/d' $F
          cat >> $F <<'EOF'

          dependencies {
            implementation(name: 'ffmpeg-kit-full-gpl', ext: 'aar')
            implementation 'com.arthenica:smart-exception-java:0.2.1'
          }
          EOF
          grep -n "implementation" $F

      - name: Generate Android files
        run: npx expo prebuild --platform android --clean

      - name: Add splash color
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/splash_color.xml <<'EOF'
          <resources>
            <color name="splashscreen_background">#FFFFFF</color>
          </resources>
          EOF

      - name: Download FFmpeg library and link it
        run: |
          mkdir -p android/libs
          curl -L --fail -o android/libs/ffmpeg-kit-full-gpl.aar https://github.com/NooruddinLakhani/ffmpeg-kit-full-gpl/releases/download/v1.0.0/ffmpeg-kit-full-gpl.aar
          ls -l android/libs
          cat >> android/build.gradle <<'EOF'

          allprojects {
            repositories {
              flatDir {
                dirs "$rootDir/libs"
              }
            }
          }
          EOF
          cat >> android/app/build.gradle <<'EOF'

          dependencies {
            implementation(name: 'ffmpeg-kit-full-gpl', ext: 'aar')
            implementation 'com.arthenica:smart-exception-java:0.2.1'
          }

          android {
            packagingOptions {
              pickFirst '**/libc++_shared.so'
            }
          }
          EOF

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          export GRADLE_OPTS="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=1"
          ./gradlew assembleRelease --no-daemon --max-workers=1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
