name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install EAS CLI directly
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm install

      - name: Patch FFmpeg Kit
        run: |
          node -e "
          const fs = require('fs');
          const path = 'node_modules/ffmpeg-kit-react-native/android/build.gradle';
          let content = fs.readFileSync(path, 'utf8');
          content = content.replace(
            /implementation 'com\.arthenica:ffmpeg-kit-'.*$/m,
            \"implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-https:6.0.3'\"
          );
          fs.writeFileSync(path, content);
          console.log('Successfully patched FFmpeg Kit to use maintained fork');
          "

      - name: Link Expo Project
        run: npx eas init --account calnrxs-team --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build with EAS
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
